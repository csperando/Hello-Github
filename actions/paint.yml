name: Paint

on:
  # Schedule paused: designs now paint a past year in one go (backfill.yml).
  # Forward painting is also gated on user_billing.paid_until, which
  # purchases no longer set - restore both together before re-enabling.
  # schedule:
  #   - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# one writer to the canvas at a time - shared with backfill.yml
concurrency:
  group: canvas-${{ vars.PAINT_TARGET_REPO || github.repository }}
  cancel-in-progress: false

env:
  API_URL: ${{ vars.API_URL || 'https://api.commitsforgood.com' }}
  # Defaults to this same repo. Once the dedicated GitHub account/canvas
  # repo exists, set the PAINT_TARGET_REPO variable and (if the target is
  # no longer this repo) a PAINT_PUSH_TOKEN secret with write access to it -
  # a config change, not a workflow rebuild.
  TARGET_REPO: ${{ vars.PAINT_TARGET_REPO || github.repository }}
  # Fail the run loudly once this many users' commits fail in one run,
  # rather than on any single failure (isolated failures are expected at
  # scale and shouldn't page anyone by themselves).
  FAILURE_ALERT_THRESHOLD: ${{ vars.PAINT_FAILURE_ALERT_THRESHOLD || '3' }}

jobs:
  paint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canvas repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.PAINT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # the commit script lives in this repo, which may not be the canvas
      - name: Checkout commit scripts
        uses: actions/checkout@v7
        with:
          path: .cfg-tools
          sparse-checkout: actions/scripts

      - name: Fetch due commits
        id: due
        env:
          SCHEDULER_API_KEY: ${{ secrets.SCHEDULER_API_KEY }}
        run: |
          set -euo pipefail
          curl -sf -H "X-API-Key: $SCHEDULER_API_KEY" "$API_URL/scheduler/due" -o due.json
          count=$(jq 'length' due.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Due: $count"

      - name: Build commits
        if: steps.due.outputs.count != '0'
        run: |
          set -euo pipefail
          .cfg-tools/actions/scripts/build-commits.sh due.json built.json
          # /scheduler/due/complete's shape: one outcome per due user
          jq '[.[] | {user_id, target_date, commit_count, status}]' built.json > results.json

      - name: Push
        if: steps.due.outputs.count != '0'
        run: |
          set -euo pipefail
          # replay on top of anything pushed since checkout, keeping each
          # committer date at its stamped author date
          branch=$(git rev-parse --abbrev-ref HEAD)
          git fetch --quiet origin "$branch"
          git rebase --quiet --committer-date-is-author-date "origin/$branch"
          git push origin "HEAD:$branch"

      - name: Report completion
        if: steps.due.outputs.count != '0'
        env:
          SCHEDULER_API_KEY: ${{ secrets.SCHEDULER_API_KEY }}
        run: |
          set -euo pipefail
          curl -sf -X POST \
            -H "X-API-Key: $SCHEDULER_API_KEY" \
            -H "Content-Type: application/json" \
            -d @results.json \
            "$API_URL/scheduler/due/complete"

      - name: Run summary
        if: always()
        run: |
          set -euo pipefail

          due="${{ steps.due.outputs.count || 0 }}"
          if [ -f results.json ]; then
            committed=$(jq '[.[] | select(.status == "committed")] | length' results.json)
            failed=$(jq '[.[] | select(.status == "failed")] | length' results.json)
          else
            committed=0
            failed=0
          fi
          # entries in due.json that never made it into a results.json outcome -
          # shouldn't normally happen, a drift indicator if it does
          skipped=$((due - committed - failed))

          {
            echo "## Paint run summary"
            echo "| due | committed | failed | skipped |"
            echo "|---|---|---|---|"
            echo "| $due | $committed | $failed | $skipped |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "due=$due committed=$committed failed=$failed skipped=$skipped"

          if [ "$failed" -ge "$FAILURE_ALERT_THRESHOLD" ]; then
            echo "::error::$failed users failed to paint this run (threshold: $FAILURE_ALERT_THRESHOLD) - failing the job so it's visible."
            exit 1
          fi

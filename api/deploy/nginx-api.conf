# Reverse proxy for the commitment_ API.
# After this is in place and DNS for api.commitsforgood.com points at this
# instance, run `sudo certbot --nginx -d api.commitsforgood.com` to add TLS --
# certbot rewrites this file in place to add the listen 443/ssl_certificate lines.

server {
    listen 80;
    server_name api.commitsforgood.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

services:
  nginx:
    build:
      context: ./deploy
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
      - "443:443"
    # volumes:
    #   - ./ssl:/etc/nginx/ssl
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: ./deploy/Dockerfile.api
    expose:
      - 3000
    
services:
  api:
    image: csperando/commitment-api:latest
    restart: unless-stopped
    expose:
      - 3000

  nginx:
    build:
      context: ./deploy
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
      - "443:443"
    # volumes:
    #   - ./ssl:/etc/nginx/ssl
    depends_on:
      - api
    
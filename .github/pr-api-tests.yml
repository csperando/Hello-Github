name: API PR Tests
run-name: Run API test suite on pull request

on:
  pull_request:
    branches: [main]
    paths: ["api/**", ".github/pr-api-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Create .env from secrets
        run: |
          cat <<'EOF' > .env
          ${{ secrets.DOT_ENV }}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

name: Vue
run-name: Build Vite Application
on:
  push:
    branches: [main]
    paths:
      - "vue/**"
      - ".github/workflows/vue.yml"
  workflow_dispatch:

jobs:
  Build-and-Push:
    runs-on: ubuntu-latest
    # the built-in GITHUB_TOKEN needs write access to push the built dist/
    # subtree to the gh-pages branch
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Update config
        run: |
          git config --global user.email "csperando@gmail.com"
          git config --global user.name "Coleman Sperando"

      - name: Build dist/ directory
        run: |
          echo "${{  github.repository }} cloned"
          cd vue
          npm install
          npm run build

      - name: Copy CNAME to dist/
        run: cp vue/CNAME vue/dist/CNAME

      - name: Add 404.html fallback for SPA history-mode routing
        run: cp vue/dist/index.html vue/dist/404.html

      - name: Force commit updated dist
        run: |
          git add vue/dist -f
          git commit -m "actions automated commit build dist/"

      - name: Check if gh-pages exists
        id: exists
        run: |
          echo "EXISTS"=`git ls-remote origin gh-pages` >> $GITHUB_OUTPUT

      - name: Push to subtree
        if: ${{ steps.exists.outputs.EXISTS }}
        run: |
          echo "Pushing changes to existing branch."
          git push origin `git subtree split --prefix=vue/dist/ main`:gh-pages --force

      - name: Create gh-pages branch
        if: ${{ !steps.exists.outputs.EXISTS }}
        run: |
          echo "The branch gh-pages does not exist. Creating initial subtree from dist/."
          git subtree push --prefix vue/dist/ origin gh-pages

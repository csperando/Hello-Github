name: Hello

on:
  # Every 30 minutes
  schedule:
    - cron: "*/30 * * * *"
  push:
  
  workflow_dispatch:

jobs:

  updateLog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: update log
        run: date +%s > log.txt

      - name: Commit log
        shell: cmd
        run: |
          set /a num=(%random%%10)+1
          echo %num%
          for /l %i in (0, 1, %num%) do (
            git config --global user.name csperando
            git config --global user.email csperando@gmail.com
            git add log.txt
            git commit -am "Automated action"
            git push)

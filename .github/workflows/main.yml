name: Hello

on:
  # Cron Syntax Reference: https://en.wikipedia.org/wiki/Cron#Overview
  # schedule:
  #  - cron: "*/60 */12 * * 1-5"
  # push:
  
  workflow_dispatch:

jobs:

  updateLog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Update and Commit Log 
        run: |         
          let n=$(( (RANDOM % 5) + 1 ))
          echo "N = $n"
          for(( i=1; i<=n; i++))
          do
            git config --global user.name csperando
            git config --global user.email csperando@gmail.com
            
            date +%s > log.txt
            git add log.txt
            git commit -am "Automated action"
            git push
            
            sleep 2
          done
          

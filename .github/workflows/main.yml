name: Hello

on:
  # Cron Syntax Reference: https://en.wikipedia.org/wiki/Cron#Overview
  schedule:
    - cron: "*/60 */5 * * *"
  push:
  
  workflow_dispatch:

jobs:

  updateLog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: update log
        run: date +%s > log.txt

      - name: Commit log
        run: |
          # git config --global user.name csperando
          # git config --global user.email csperando@gmail.com
          # git add log.txt
          # git commit -am "Automated action"
          # git push
          
          let n=$((RANDOM %= 10))
          echo "N = $n"
          for(( i=0; i<=$n; i++))
          do
            echo -n "$i"
            sleep 1
          done
          
          echo "Done."
          

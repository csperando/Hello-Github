name: API
run-name: Test, build, and deploy the API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
  workflow_dispatch:

env:
  DOCKER_REPOSITORY: commitment-api

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.token }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Create .env from secrets
        run: |
          cat <<'EOF' > .env
          ${{ secrets.DOT_ENV }}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    outputs:
      registry: docker.io
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.token }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Generate .env file
        id: env
        run: |
          cat <<'EOF' > .env
          ${{ secrets.DOT_ENV }}
          EOF

      - name: Build, tag, and push
        id: build
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/$DOCKER_REPOSITORY"
          docker build -f deploy/Dockerfile.api -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" . --no-cache
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.DOCKER_TOKEN }}" | sudo docker login --username ${{ secrets.DOCKER_USERNAME }} --password-stdin
            sudo docker pull ${{ needs.build-and-push.outputs.image }}:latest
            sudo docker compose pull ${{ needs.build-and-push.outputs.image }}:latest
            sudo docker compose up -d
            sudo docker image prune -f
            # sudo systemctl restart commitment-api
            # sudo systemctl status commitment-api --no-pager

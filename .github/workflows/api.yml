name: API
run-name: Test, build, and deploy the API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.token }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Create .env from secrets
        run: |
          cat <<'EOF' > .env
          ${{ secrets.DOT_ENV }}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - name: commitment-api
            dockerfile: deploy/Dockerfile.api
            context: .
          - name: commitment-nginx
            dockerfile: Dockerfile.nginx
            context: deploy
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.token }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # No longer baking secrets into the image - injected at runtime by the deploy job instead.
      # - name: Generate .env file
      #   run: |
      #     cat <<'EOF' > .env
      #     ${{ secrets.DOT_ENV }}
      #     EOF

      # - name: Generate ssl certs
      #   run: |
      #     cat <<'EOF' > deploy/nginx/ssl/api.commitsforgood.com.pem
      #     ${{ secrets.API_SSL_PEM }}
      #     EOF
      #     cat <<'EOF' > deploy/nginx/ssl/api.commitsforgood.com.key
      #     ${{ secrets.API_SSL_KEY }}
      #     EOF

      - name: Build, tag, and push
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ matrix.name }}"
          docker build -f ${{ matrix.dockerfile }} -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ${{ matrix.context }}
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Stage secrets for transfer
        run: |
          mkdir -p ssl
          cat <<'EOF' > .env
          ${{ secrets.DOT_ENV }}
          EOF
          cat <<'EOF' > ssl/api.commitsforgood.com.pem
          ${{ secrets.API_SSL_PEM }}
          EOF
          cat <<'EOF' > ssl/api.commitsforgood.com.key
          ${{ secrets.API_SSL_KEY }}
          EOF

      - name: Copy compose.yml and secrets to host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "compose.yml,.env,ssl/*"
          target: "/home/ec2-user"

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user
            chmod 600 ssl/*.key
            echo "${{ secrets.DOCKER_TOKEN }}" | sudo docker login --username ${{ secrets.DOCKER_USERNAME }} --password-stdin
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker image prune -f

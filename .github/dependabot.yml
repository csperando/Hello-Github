# Dependabot minimum configuration for npm, docker, and gh actions

version: 2
updates:
  - package-ecosystem: "npm"
    # Look for `package.json` and `lock` files in the `api` directory
    directory: "/api"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    # Look for a `Dockerfile` in the `root` directory
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    # Using directory "/" will still find files in "/.github"
    directory: "/"
    schedule:
      interval: "weekly"
